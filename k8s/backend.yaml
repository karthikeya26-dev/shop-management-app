apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30005
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shop-backend:latest
          imagePullPolicy: Never # For local minikube deployment
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:password@postgres:5432/shop_db
            - name: SECRET_KEY
              value: production-secret-key
            - name: JWT_SECRET_KEY
              value: production-jwt-key
          ports:
            - containerPort: 5000
